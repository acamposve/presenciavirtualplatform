name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A newer run for the same branch makes an older one pointless - cancel it rather than paying for
# both (constitution 10.5's gates, applied without wasting runner minutes).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  # Same value the test fixture sets for itself; present here so a failure to configure the app
  # role surfaces as a clear error rather than a confusing startup exception.
  DOTNET_ENVIRONMENT: Development

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      # Keyed on the project files and the shared build configuration, so a change to a package
      # reference invalidates the cache while a source-only change restores it.
      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', 'Directory.Build.props', 'global.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore src/PresenciaVirtual.slnx

      # TreatWarningsAsErrors is already set in Directory.Build.props; passing it explicitly keeps
      # the intent visible here, where someone might otherwise relax it locally without noticing.
      - name: Build
        run: dotnet build src/PresenciaVirtual.slnx --configuration Release --no-restore -warnaserror

      # The integration suite spins up PostgreSQL via Testcontainers, so the daemon must be
      # reachable. ubuntu-latest ships Docker; this step turns an unavailable daemon into an
      # explicit, readable failure instead of a wall of container-connection retries.
      - name: Verify Docker is available for Testcontainers
        run: docker info --format 'Docker server {{.ServerVersion}} is available'

      - name: Test
        run: dotnet test src/PresenciaVirtual.slnx --configuration Release --no-build --logger "console;verbosity=normal"
