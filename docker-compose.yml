services:
  postgres:
    image: postgres:17
    container_name: presenciavirtual-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-presenciavirtual}
      POSTGRES_USER: ${POSTGRES_USER:-presenciavirtual}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-presenciavirtual}
    ports:
      - "5432:5432"
    volumes:
      - presenciavirtual-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-presenciavirtual}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  presenciavirtual-postgres-data:
